<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- WALK WITH ME Dark v1.1 · Oct 23 — landing screen: Walk / Run / Cycle / Roll chooser, Start Trip, Call 911, Sound Alarm (same alarm as On Your Way) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HELORA — Walk With Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #000000;
    --text-primary: #FFFFFF;
    --text-muted: rgba(255,255,255,0.65);
    --text-faint: rgba(255,255,255,0.40);
    --divider: rgba(255,255,255,0.12);
    --accent-blue: #4E82C9;
    --accent-red: #CB3947;
    --btn-green-solid: #8FB37E;
    --btn-green-text: #0A0D12;
    --mover-border: rgba(255,255,255,0.40);
    --mover-fill: rgba(143,179,126,0.16);

    /* Sound Alarm — same provisional tokens as On Your Way */
    --alarm-rest: #5A48BE;
    --alarm-arming: #6A55D6;
    --alarm-triggered: #7C5CE8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Lato', -apple-system, sans-serif; background: #000000; min-height: 100vh; padding: 0; }

  .device {
    width: 100%; max-width: 430px; margin: 0 auto;
    height: 100vh; height: 100dvh;
    background: var(--canvas);
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .scroll-content {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column;
  }

  /* ---------- Official HELORA header: Back pill baked into PNG; invisible link over it ---------- */
  .hdr-wrap { padding: max(8px, env(safe-area-inset-top)) 8px 0; flex-shrink: 0; }
  .hdr { position: relative; display: block; }
  .hdr img { display: block; width: 100%; height: auto; }
  .hdr .back { position: absolute; left: 7.7%; top: 26%; width: max(19%, 64px); height: 44px; transform: translate(-50%, -50%); border-radius: 999px; }
  .hdr .back:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

  /* ---------- Walk With Me ---------- */
  .wwm { display: flex; flex-direction: column; align-items: center; padding: 28px 20px 0; flex-shrink: 0; }
  .wwm-title { margin: 0 0 18px; font-size: clamp(30px, 8.6vw, 36px); font-weight: 900; line-height: 1.1; letter-spacing: -0.2px; color: var(--text-primary); text-align: center; }

  .wwm-btn {
    width: 100%; max-width: 390px; min-height: 64px;
    border-radius: 999px; border: none;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-family: inherit; font-size: 24px; font-weight: 900; letter-spacing: 0.01em;
    text-decoration: none; cursor: pointer;
    transition: transform 0.08s ease;
  }
  .wwm-btn:active { transform: scale(0.985); }
  .wwm-btn:focus-visible { outline: 3px solid var(--accent-blue); outline-offset: 3px; }
  .wwm-btn svg { flex: none; }
  .btn-start { background: var(--btn-green-solid); color: var(--btn-green-text); }
  .btn-start .arrow { margin-left: auto; }
  .btn-start { justify-content: center; position: relative; }
  .btn-start .arrow { position: absolute; right: 26px; }
  .btn-911 { background: var(--accent-red); color: #FFFFFF; margin-top: 16px; }

  /* ---------- Mover chooser: Walk / Run / Cycle / Roll ---------- */
  .wwm-prompt { margin: 0 0 12px; font-size: 17px; font-weight: 700; color: var(--text-muted); text-align: center; }
  .movers { display: flex; gap: 8px; width: 100%; max-width: 390px; }
  .mover {
    flex: 1 1 0; min-width: 0; min-height: 96px; padding: 10px 4px 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: transparent; border: 2px solid var(--mover-border); border-radius: 16px;
    color: var(--text-primary); font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease;
  }
  .mover img { display: block; width: 52px; height: 52px; }
  .mover[aria-checked="true"] { border-color: var(--btn-green-solid); background: var(--mover-fill); }
  .mover:focus-visible { outline: 3px solid var(--accent-blue); outline-offset: 3px; }
  .mover-note { margin: 10px 0 22px; min-height: 22px; font-size: 15px; font-weight: 500; color: var(--text-muted); text-align: center; }

  /* Gap that signals "different category of action" between emergency button and the calmer Sound Alarm */
  .category-gap { height: 32px; display: flex; align-items: center; justify-content: center; padding: 0 20px; flex-shrink: 0; margin-top: 6px; }
  .category-gap::before { content: ""; width: 100%; height: 1px; background: var(--divider); }

  .alarm-zone { display: flex; flex-direction: column; align-items: center; padding: 0 20px 24px; flex-shrink: 0; }
  .alarm-caption { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px; text-align: center; line-height: 1.5; }
  .alarm-btn {
    width: 130px; height: 130px; border-radius: 50%;
    background: var(--alarm-rest); border: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: inherit; font-size: 20px; font-weight: 900; line-height: 1.15; letter-spacing: 0.01em;
    transition: width .3s ease, height .3s ease, background-color .3s ease;
    touch-action: none; user-select: none; position: relative; cursor: pointer;
  }
  .alarm-btn::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 2px solid var(--alarm-arming); opacity: 0; transition: opacity .3s ease; }
  .alarm-btn.primed::after, .alarm-btn.arming::after, .alarm-btn.triggered::after { opacity: 1; }
  .alarm-btn.arming { width: 168px; height: 168px; background: var(--alarm-arming); }
  .alarm-btn.triggered { width: 204px; height: 204px; background: var(--alarm-triggered); box-shadow: 0 0 28px 2px rgba(124,92,232,0.45); }
  .alarm-btn:focus-visible { outline: 3px solid var(--accent-blue); outline-offset: 6px; }

  .version-tag { text-align: center; font-size: 11px; color: var(--text-faint); padding: 0 0 max(12px, env(safe-area-inset-bottom)); flex-shrink: 0; }

  /* Small non-blocking note (used until the trip-setup screen exists) */
  .toast { position: absolute; left: 20px; right: 20px; bottom: max(24px, env(safe-area-inset-bottom)); padding: 14px 16px; border-radius: 12px; background: #253F6C; color: #fff; font-size: 16px; font-weight: 700; text-align: center; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease; z-index: 5; }
  .toast.show { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .wwm-btn, .alarm-btn, .alarm-btn::after, .toast { transition: none; }
  }
</style>
</head>

      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

  <div class="category-gap"></div>

  <div class="alarm-zone">
    <div class="alarm-caption">
      <div>Double-tap to sound alarm</div>
      <div>Single tap to turn alarm off</div>
    </div>
    <button class="alarm-btn" id="alarmBtn">Sound<br>Alarm</button>
  </div>
  <div class="version-tag">Walk With Me · Dark · v1.1 · Oct 23</div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Trip setup is the next screen to build.</div>
</div>

<script>
  // Mover chooser. The choice is kept for the trip-setup screen (not built yet):
  // it can read sessionStorage 'helora_wwmMode' = walk | run | cycle | roll.
  (function () {
    const MODES = {walk: "Walking", run: "Running", cycle: "Cycling", roll: "Wheelchair, scooter or other mobility device"};
    const buttons = Array.from(document.querySelectorAll('.mover'));
    const note = document.getElementById('moverNote');
    function select(mode, focus) {
      buttons.forEach(b => {
        const on = b.dataset.mode === mode;
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        if (on && focus) b.focus();
      });
      note.textContent = MODES[mode];
      try { sessionStorage.setItem('helora_wwmMode', mode); } catch (e) {}
    }
    let start = 'walk';
    try { const saved = sessionStorage.getItem('helora_wwmMode'); if (saved && MODES[saved]) start = saved; } catch (e) {}
    select(start, false);
    buttons.forEach((b, i) => {
      b.addEventListener('click', () => select(b.dataset.mode, false));
      b.addEventListener('keydown', e => {
        let j = null;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % buttons.length;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + buttons.length) % buttons.length;
        if (j !== null) { e.preventDefault(); select(buttons[j].dataset.mode, true); }
      });
    });
  })();

  // Start Trip: set START_HREF to the trip-setup screen's filename once it exists.
  const START_HREF = '';
  document.getElementById('startTrip').addEventListener('click', () => {
    if (START_HREF) { location.href = START_HREF; return; }
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  });

  // ==================================================================
  // Sound Alarm — carried over verbatim from the standalone alarm
  // mockup. Siren is the same Web Audio oscillator used in
  // i-cant-talk.html (sawtooth wave, wobbling 760–1120Hz) so it's one
  // alarm sound across HELORA, not a second one to learn.
  // ==================================================================
  const alarmBtn = document.getElementById('alarmBtn');
  let triggered = false;
  let primed = false;
  let primeTimer = null;

  var audioCtx = null, oscNode = null, gainNode = null, sirenTimer = null;
  function startSiren() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      oscNode = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();
      oscNode.type = 'sawtooth';
      oscNode.frequency.value = 760;
      gainNode.gain.value = 0.06;
      oscNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscNode.start();
      var up = true;
      sirenTimer = setInterval(function () {
        if (!oscNode) return;
        var target = up ? 1120 : 760;
        oscNode.frequency.linearRampToValueAtTime(target, audioCtx.currentTime + 0.5);
        up = !up;
      }, 500);
    } catch (e) { /* audio unavailable */ }
  }
  function stopSiren() {
    if (sirenTimer) { clearInterval(sirenTimer); sirenTimer = null; }
    if (oscNode) { try { oscNode.stop(); } catch (e) {} oscNode.disconnect(); oscNode = null; }
    if (gainNode) { gainNode.disconnect(); gainNode = null; }
  }

  function growToTriggered() {
    alarmBtn.classList.add('arming');
    setTimeout(() => {
      alarmBtn.classList.remove('arming');
      alarmBtn.classList.add('triggered');
      alarmBtn.innerHTML = 'Alarm<br>Sounding';
      triggered = true;
      startSiren();
      if ('vibrate' in navigator) navigator.vibrate(200);
    }, 260);
  }

  function stopAlarm() {
    alarmBtn.classList.remove('triggered');
    stopSiren();
    if ('vibrate' in navigator) navigator.vibrate([40, 30, 40]);
    setTimeout(() => {
      triggered = false;
      alarmBtn.innerHTML = 'Sound<br>Alarm';
    }, 260);
  }

  function handleTapWhileOff() {
    if (!primed) {
      primed = true;
      alarmBtn.classList.add('primed');
      if ('vibrate' in navigator) navigator.vibrate(15);
      primeTimer = setTimeout(() => {
        primed = false;
        alarmBtn.classList.remove('primed');
      }, 500);
    } else {
      clearTimeout(primeTimer);
      primed = false;
      alarmBtn.classList.remove('primed');
      growToTriggered();
    }
  }

  alarmBtn.addEventListener('click', () => {
    if (triggered) {
      // One tap always stops it — no double-tap needed to close.
      stopAlarm();
    } else {
      handleTapWhileOff();
    }
  });
</script>
