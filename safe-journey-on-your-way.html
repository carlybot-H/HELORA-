<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HELORA — Safe Journey: On Your Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  /* ---------- BLACK MODE (default) ---------- */
  [data-theme="black"] {
    --canvas: #000000;
    --surface: #14161A;
    --surface-raised: #1D2026;
    --text-primary: #FFFFFF;
    --text-muted: rgba(255,255,255,0.65);
    --text-faint: rgba(255,255,255,0.40);
    --divider: rgba(255,255,255,0.12);

    --accent-blue: #4E82C9;
    --accent-amber: #D39D35;
    --accent-red: #CB3947;
    --trail-green: #3FA34D;
    --calm-green: #8FB37E;

    --amber-fill-tint: rgba(211,157,53,0.20);
    --green-fill-tint: rgba(143,179,126,0.20);
    --btn-text-on-tint: #FFFFFF;
    --btn-green-solid: #8FB37E;
    --btn-amber-solid: #D39D35;
  }

  /* ---------- IVORY MODE ---------- */
  [data-theme="ivory"] {
    --canvas: #F7F7F2;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --text-primary: #253F6C;
    --text-muted: rgba(37,63,108,0.65);
    --text-faint: rgba(37,63,108,0.40);
    --divider: rgba(37,63,108,0.14);

    --accent-blue: #4E82C9;
    --accent-amber: #7D5C1C;        /* reading amber — text/fine outlines */
    --accent-amber-fill: #DAA60B;   /* amber accent — decorative fills/borders/icons */
    --accent-amber-text-on-fill: #8A6A0A;
    --accent-red: #C5152A;
    --calm-green: #517042;

    --amber-fill-tint: rgba(218,166,11,0.20);
    --green-fill-tint: rgba(81,112,66,0.16);
    --btn-text-on-tint: #253F6C;
    --btn-green-solid: #3FA34D;   /* approved, 19px+ bold text meets 3:1 large-text AA */
    --btn-amber-solid: #B8860B;   /* approved, 19px+ bold text meets 3:1 large-text AA */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }

  body {
    font-family: 'Lato', -apple-system, sans-serif;
    background: #E7E7E2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 12px;
  }

  .device {
    width: 390px;
    max-width: 100%;
    height: 844px;
    max-height: 92vh;
    background: var(--canvas);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    transition: background 0.25s ease;
    display: flex;
    flex-direction: column;
  }

  /* ---- dev-only theme toggle, not part of shipped screen ---- */
  .dev-toggle {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: #DDD;
    justify-content: center;
    flex-shrink: 0;
  }
  .dev-toggle button {
    padding: 8px 22px;
    border-radius: 20px;
    border: 1.5px solid #999;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Lato', sans-serif;
  }
  .dev-toggle button.active { background: #253F6C; color: #fff; border-color: #253F6C; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 4px;
    flex-shrink: 0;
  }
  .back-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
  }
  .back-btn:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
  .screen-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .spacer36 { width: 36px; }

  /* ---------- Hero trail graphic ---------- */
  .hero-wrap {
    padding: 8px 24px 4px;
    flex-shrink: 0;
  }
  .hero-graphic {
    width: 100%;
    display: block;
  }

  /* ---------- Status card ---------- */
  .status-block {
    padding: 8px 28px 0;
    text-align: center;
    flex-shrink: 0;
  }
  .status-block h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 900;
    color: var(--text-primary);
  }
  .status-block p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text-muted);
  }
  .status-block .watcher {
    color: var(--accent-blue);
    font-weight: 700;
  }

  .eta-pill {
    margin: 18px auto 0;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--divider);
  }
  .eta-pill .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .eta-pill .time {
    font-size: 17px;
    font-weight: 900;
    color: var(--text-primary);
  }

  /* ---------- Action buttons ---------- */
  .actions {
    margin-top: auto;
    padding: 20px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
  }

  .btn {
    width: 100%;
    padding: 15px 20px;
    border-radius: var(--radius-md);
    font-family: 'Lato', sans-serif;
    font-size: 19px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

  .btn-primary {
    background: var(--btn-green-solid);
    border-color: var(--btn-green-solid);
    color: #FFFFFF;
  }

  .btn-amber-tint {
    background: var(--btn-amber-solid);
    border-color: var(--btn-amber-solid);
    color: #FFFFFF;
  }

  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  .emergency-link {
    text-align: center;
    padding: 4px 0 18px;
    flex-shrink: 0;
  }
  .emergency-link a {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-red);
    text-decoration: none;
  }
  .emergency-link a:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

  /* ---------- Overlay shared ---------- */
  .overlay-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }
  .overlay-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 10px 24px 28px;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 11;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.25);
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--divider);
    border-radius: 4px;
    margin: 8px auto 18px;
  }
  .sheet-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--text-primary);
    margin: 0 0 4px;
  }
  .sheet-sub {
    font-size: 13.5px;
    color: var(--text-muted);
    margin: 0 0 18px;
  }

  .menu-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 4px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--divider);
    text-align: left;
    cursor: pointer;
    font-family: 'Lato', sans-serif;
  }
  .menu-row:last-of-type { border-bottom: none; }
  .menu-row:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: -2px; }
  .menu-row .icon {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--amber-fill-tint);
    color: var(--accent-amber);
    flex-shrink: 0;
  }
  .menu-row .icon svg { width: 17px; height: 17px; }
  .menu-row .icon.red { background: rgba(203,57,71,0.16); color: var(--accent-red); }
  .menu-row .txt { display: flex; flex-direction: column; }
  .menu-row .txt strong { font-size: 15px; color: var(--text-primary); font-weight: 700; }
  .menu-row .txt span { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }

  .sheet-close {
    position: absolute;
    top: 18px; right: 18px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--divider);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .sheet-close:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

  /* ---------- Time wheel picker ---------- */
  .wheel-row {
    display: flex;
    justify-content: center;
    gap: 4px;
    height: 168px;
    margin: 6px 0 22px;
    position: relative;
  }
  .wheel-row::before {
    content: "";
    position: absolute;
    left: 12px; right: 12px;
    top: 63px; height: 42px;
    border-top: 1.5px solid var(--divider);
    border-bottom: 1.5px solid var(--divider);
    pointer-events: none;
  }
  .wheel {
    width: 64px;
    height: 168px;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -ms-overflow-style: none;
    scrollbar-width: none;
    padding: 63px 0;
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel-item {
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .wheel-item.mid { color: var(--text-primary); font-weight: 900; }

  .sheet-btn-row { display: flex; gap: 10px; }
  .sheet-btn-row .btn { flex: 1; }
  .btn-ghost {
    background: transparent;
    border-color: var(--divider);
    color: var(--text-muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .overlay-backdrop, .btn { transition: none; }
  }
</style>
</head>

    document.getElementById('device').setAttribute('data-theme', theme);
    document.getElementById('btnBlack').classList.toggle('active', theme === 'black');
    document.getElementById('btnIvory').classList.toggle('active', theme === 'ivory');
    document.getElementById('heroImgBlack').style.display = theme === 'black' ? 'block' : 'none';
    document.getElementById('heroImgIvory').style.display = theme === 'ivory' ? 'block' : 'none';
  }

  function openSheet(name) {
    document.getElementById('backdrop' + cap(name)).classList.add('open');
    document.getElementById('sheet' + cap(name)).classList.add('open');
  }
  function closeSheet(name) {
    document.getElementById('backdrop' + cap(name)).classList.remove('open');
    document.getElementById('sheet' + cap(name)).classList.remove('open');
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ---- build time wheels ----
  function buildWheel(id, items, startIndex) {
    const el = document.getElementById(id);
    el.innerHTML = items.map((v, i) =>
      `<div class="wheel-item${i === startIndex ? ' mid' : ''}">${v}</div>`
    ).join('');
    el.scrollTop = startIndex * 42;
    el.addEventListener('scroll', () => {
      const idx = Math.round(el.scrollTop / 42);
      [...el.children].forEach((c, i) => c.classList.toggle('mid', i === idx));
    });
  }
  const hours = Array.from({length:12}, (_,i)=> String(i+1));
  const mins = Array.from({length:60}, (_,i)=> String(i).padStart(2,'0'));
  buildWheel('wheelHour', hours, 6);   // defaults near 7
  buildWheel('wheelMin', mins, 45);    // defaults near :45
  buildWheel('wheelPeriod', ['AM','PM'], 1);
</script>
