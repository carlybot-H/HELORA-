  :root{
    --canvas:#000000;
    --card:#000000;
    --white:#F4F6FA;
    --subtitle:#8E8F94;
    --gold-top:#DCA94F;
    --gold-bot:#C5903A;
    --blue:#4E82C9;     /* I'm On The Move */
    --amber:#D39D35;    /* Expecting Someone? */
    --green:#80956A;    /* Our Routines — calm / ordinary, recedes */
    --brand-red:#C5152A;
    --brand-navy:#253F6C;
    --hair:rgba(255,255,255,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--canvas);}
  body{
    min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    color:var(--white);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .scr-sj{
    max-width:480px;margin:0 auto;
    min-height:100dvh;
    display:flex;flex-direction:column;
    padding:
      max(env(safe-area-inset-top),8px)
      max(env(safe-area-inset-right),0px)
      max(env(safe-area-inset-bottom),18px)
      max(env(safe-area-inset-left),0px);
  }

  /* ---------- Header (approved banner) + live Back button ---------- */
  .sj-header{position:relative;width:100%;}
  .sj-header img{display:block;width:100%;height:auto;}
  .sj-back{
    position:absolute;left:3%;top:44.4%;transform:translateY(-50%);
    display:inline-flex;align-items:center;gap:.22em;
    background:#FFFFFF;color:var(--brand-navy);
    border:1.8px solid var(--brand-red);border-radius:999px;
    font:600 clamp(9.5px,2.6vw,11.5px)/1 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    letter-spacing:.1px;
    padding:.34em .62em .34em .44em;min-height:23px;
    cursor:pointer;
    box-shadow:0 1px 2.5px rgba(0,0,0,.22);
  }
  .sj-back svg{flex:none;width:13px;height:13px;}
  .sj-back:active{transform:translateY(-50%) scale(.95);}
  .sj-back:focus-visible{outline:2.5px solid var(--brand-red);outline-offset:2px;}

  /* ---------- Body ---------- */
  .sj-body{flex:1;padding:0 20px;}
  .sj-title{
    margin:30px 0 0;font-weight:800;letter-spacing:-.5px;line-height:1.0;
    font-size:clamp(40px,12vw,56px);
    color:var(--gold-top); /* fallback */
    background:linear-gradient(180deg,var(--gold-top),var(--gold-bot));
    -webkit-background-clip:text;background-clip:text;
  }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .sj-title{color:transparent;}
  }
  .sj-sub{margin:14px 0 0;font-size:clamp(18px,5vw,21px);font-weight:400;color:var(--subtitle);letter-spacing:.1px;}

  .sj-cards{margin-top:34px;display:flex;flex-direction:column;gap:18px;}

  .sj-card{
    width:100%;text-align:left;background:var(--card);
    border:2px solid var(--accent);border-radius:22px;
    padding:18px 16px;
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:12px;
    cursor:pointer;color:inherit;text-decoration:none;
    transition:transform .12s ease, background-color .12s ease;
  }
  .sj-card, .sj-card *{text-decoration:none;}
  .sj-card:active{transform:scale(.985);background:#070A0F;}
  .sj-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
  .sj-ic{width:clamp(66px,17.5vw,76px);height:clamp(66px,17.5vw,76px);display:block;}
  .sj-ic img{width:100%;height:100%;display:block;object-fit:contain;}
  .sj-tt{min-width:0;}
  .sj-h{display:block;margin:0;font-size:clamp(19px,5.1vw,22px);font-weight:800;color:var(--white);letter-spacing:-.2px;line-height:1.04;}
  .sj-d{display:block;margin:12px 0 0;font-size:clamp(17px,4.8vw,19px);font-weight:500;color:var(--accent);line-height:1.16;}
  .sj-d .nowrap{white-space:nowrap;}
  .sj-chev{flex:none;color:var(--accent);}

  .sj-move{--accent:var(--blue);}
  .sj-expect{--accent:var(--amber);}
  .sj-rout{--accent:var(--green);}

  @media (prefers-reduced-motion: reduce){
    .sj-card,.sj-back{transition:none;}
  }

  /* ===== stitch shell ===== */
  #stage[hidden], #home-screen[hidden] { display:none !important; }
  #stage { position:fixed; inset:0; max-width:480px; margin:0 auto; background:var(--canvas); }
  #frame { width:100%; height:100%; border:0; display:block; background:var(--canvas); }
  .nav-back {
    position:absolute; z-index:50;
    top:calc(env(safe-area-inset-top) + 12px); left:14px;
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 15px 9px 11px; border-radius:999px;
    background:rgba(8,10,14,.62); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.22); color:#F4F6FA;
    font-family:"Lato",sans-serif; font-size:15px; font-weight:700; letter-spacing:.2px;
    cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,.45);
  }
  .nav-back svg { width:9px; height:14px; }
  .nav-back:active { transform:scale(.96); }
</style>
